name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Built worker startup regressions
        run: pnpm test:worker-startup

      - name: Run package-aware tests with coverage
        run: pnpm test:coverage

      - name: Compose project helper test
        run: pnpm e2e:compose-project-test

      - name: Fixture replacement helper test
        run: pnpm e2e:fixture-replacement-test

      - name: Package entrypoint smoke test
        run: pnpm --filter @gh-symphony/cli test:package

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image from local package bundle
        run: |
          docker build \
            --build-arg INSTALLER_STAGE=installer-local \
            --tag gh-symphony:test .

      - name: Smoke test container image
        run: |
          TMPDIR="$(mktemp -d)"
          mkdir -p "${TMPDIR}/config/repo"

          cat > "${TMPDIR}/config/repo/WORKFLOW.md" <<'EOF'
          ---
          tracker:
            kind: file
            provider:
              project_id: smoke-file
              state_field: Status
            active_states:
              - Ready
            terminal_states:
              - Done
          polling:
            interval_ms: 30000
          agent:
            max_concurrent_agents: 1
          repository:
            slug: smoke-org/smoke-repo
          codex:
            command: node /app/e2e/stub-worker.js
          ---
          Smoke test workflow.
          EOF

          echo "[]" > "${TMPDIR}/config/issues.json"
          git -C "${TMPDIR}/config/repo" init
          git -C "${TMPDIR}/config/repo" remote add origin https://github.com/smoke-org/smoke-repo.git
          sudo chown -R 1000:1000 "${TMPDIR}/config"

          docker run --rm gh-symphony:test gh-symphony --version
          docker run --rm \
            -v "${TMPDIR}/config:/var/lib/gh-symphony" \
            -e GH_SYMPHONY_FILE_TRACKER_ISSUES_PATH=/var/lib/gh-symphony/issues.json \
            gh-symphony:test \
            gh-symphony project start --project-dir /var/lib/gh-symphony/repo --once

  standalone-docker-e2e:
    name: Standalone Docker E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run standalone project Docker E2E
        run: |
          set +e
          ./e2e/run-standalone-project-e2e.sh
          status=$?
          set -e

          if [ "$status" -eq 69 ]; then
            echo "::error::Docker E2E preflight exited 69; CI requires a reachable Docker runtime"
          fi

          exit "$status"
