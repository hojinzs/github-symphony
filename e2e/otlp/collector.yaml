# Test-only credentials. No host ports or production secrets.
extensions:
  basicauth/fixture:
    htpasswd:
      inline: "fixture:{SHA}IUwzWnlIJ+vIDgsEvUajdYFS5v4="
receivers:
  otlp/plain:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  otlp/auth:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: basicauth/fixture
exporters:
  file/logs:
    path: /evidence/logs.jsonl
    append: true
    flush_interval: 100ms
  file/metrics:
    path: /evidence/metrics.jsonl
    append: true
    flush_interval: 100ms
service:
  extensions: [basicauth/fixture]
  pipelines:
    logs:
      receivers: [otlp/plain, otlp/auth]
      exporters: [file/logs]
    metrics:
      receivers: [otlp/plain, otlp/auth]
      exporters: [file/metrics]
